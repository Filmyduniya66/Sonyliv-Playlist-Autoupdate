
name: PremiumPlugx M3U Auto Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Playlist
        run: |
          curl -fLsS --retry 3 \
          "https://premiumplugx.top/slivevents/sony.php" \
          -o /tmp/sony.m3u

          grep -q '^#EXTM3U' /tmp/sony.m3u
          grep -q '^#EXTINF' /tmp/sony.m3u

          cp /tmp/sony.m3u sony.m3u

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sony.m3u
          git diff --cached --quiet || (
            git commit -m "Auto update Sony M3U"
            git push
          )
